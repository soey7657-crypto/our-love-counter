<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Our Love Counter ♡</title>

  <!-- Romantic fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link

    href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap"

    rel="stylesheet"

  >

  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }

    body {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

      color: #fff7eb;

      background:

        radial-gradient(

          circle at 50% 20%,

          rgba(255, 220, 200, 0.10),

          transparent 32%

        ),

        linear-gradient(

          145deg,

          #4b0712 0%,

          #731523 42%,

          #8a1d2c 65%,

          #4a0711 100%

        );

      overflow-x: hidden;

    }

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      background-image:

        radial-gradient(

          rgba(255,255,255,0.03) 1px,

          transparent 1px

        );

      background-size: 7px 7px;

      opacity: 0.35;

    }

    .wrap {

      width: min(940px, 100%);

      position: relative;

    }

    .card {

      position: relative;

      text-align: center;

      padding: 52px 28px 42px;

      background:

        linear-gradient(

          180deg,

          rgba(92, 12, 26, 0.70),

          rgba(67, 7, 18, 0.72)

        );

      border: 1px solid rgba(238, 204, 170, 0.28);

      border-radius: 30px;

      box-shadow:

        0 22px 70px rgba(25, 0, 5, 0.45),

        inset 0 1px 0 rgba(255,255,255,0.05);

      backdrop-filter: blur(9px);

    }

    .card::before,

    .card::after {

      content: "♡";

      position: absolute;

      font-family: "Cormorant Garamond", serif;

      color: rgba(245, 216, 187, 0.20);

      font-size: 44px;

    }

    .card::before {

      top: 18px;

      left: 24px;

      transform: rotate(-12deg);

    }

    .card::after {

      bottom: 16px;

      right: 25px;

      transform: rotate(10deg);

    }

    .eyebrow {

      margin-bottom: 9px;

      font-family: "Montserrat", sans-serif;

      font-size: 11px;

      letter-spacing: 4px;

      text-transform: uppercase;

      color: #e7c1b4;

    }

    .title {

      line-height: 0.90;

      margin-bottom: 14px;

    }

    .title .our {

      font-family: "Cormorant Garamond", serif;

      font-size: clamp(48px, 8vw, 92px);

      font-weight: 600;

      color: #fff4e6;

    }

    .title .love {

      display: inline-block;

      margin-left: 8px;

      font-family: "Allura", cursive;

      font-size: clamp(64px, 10vw, 112px);

      font-weight: 400;

      color: #f1c8b6;

      transform: rotate(-4deg);

    }

    .since {

      margin-top: 2px;

      margin-bottom: 36px;

      font-family: "Cormorant Garamond", serif;

      font-size: 18px;

      letter-spacing: 0.6px;

      color: #d9b99f;

    }

    .divider {

      width: 90px;

      height: 1px;

      margin: 0 auto 32px;

      background:

        linear-gradient(

          to right,

          transparent,

          #d9b58e,

          transparent

        );

    }

    .counter {

      display: grid;

      grid-template-columns: repeat(6, 1fr);

      gap: 12px;

    }

    .box {

      position: relative;

      padding: 24px 8px 20px;

      border-radius: 20px;

      background:

        linear-gradient(

          180deg,

          rgba(255,255,255,0.09),

          rgba(255,255,255,0.045)

        );

      border: 1px solid rgba(245, 218, 193, 0.17);

      box-shadow:

        inset 0 1px 0 rgba(255,255,255,0.05);

    }

    .number {

      display: block;

      font-family: "Cormorant Garamond", serif;
      font-size: clamp(34px, 5vw, 58px);

      line-height: 1;

      font-weight: 600;

      color: #fff4df;

    }

    .label {

      display: block;

      margin-top: 9px;

      font-family: "Montserrat", sans-serif;

      font-size: 9px;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      color: #d9aca9;

    }

    .footer {

      margin-top: 31px;

      font-family: "Allura", cursive;

      font-size: 28px;

      color: #efc3bb;

    }

    .tiny-heart {

      display: inline-block;

      margin-left: 3px;

      animation: heartbeat 1.6s ease-in-out infinite;

    }

    @keyframes heartbeat {

      0%, 100% {

        transform: scale(1);

      }

      25% {

        transform: scale(1.12);

      }

      50% {

        transform: scale(1);

      }

      75% {

        transform: scale(1.08);

      }

    }

    @media (max-width: 760px) {

      body {

        padding: 16px;

      }

      .card {

        padding: 40px 15px 34px;

        border-radius: 24px;

      }

      .counter {

        grid-template-columns: repeat(3, 1fr);

        gap: 10px;

      }

      .box {

        padding: 20px 6px 17px;

      }

      .title .our {

        font-size: 48px;

      }

      .title .love {

        font-size: 65px;

      }

      .footer {

        font-size: 25px;

      }

    }

  </style>

</head>

<body>

  <div class="wrap">

    <div class="card">

      <div class="eyebrow">

        We've been together for

      </div>

      <div class="title">

        <span class="our">Our</span>

        <span class="love">Love</span>

      </div>

      <div class="since">

        Since May 18, 2024 ♡

      </div>

      <div class="divider"></div>

      <div class="counter">

        <div class="box">

          <span class="number" id="years">0</span>

          <span class="label">Years</span>

        </div>

        <div class="box">

          <span class="number" id="months">0</span>

          <span class="label">Months</span>

        </div>

        <div class="box">

          <span class="number" id="days">0</span>

          <span class="label">Days</span>

        </div>

        <div class="box">

          <span class="number" id="hours">00</span>

          <span class="label">Hours</span>

        </div>

        <div class="box">

          <span class="number" id="minutes">00</span>

          <span class="label">Minutes</span>

        </div>

        <div class="box">

          <span class="number" id="seconds">00</span>

          <span class="label">Seconds</span>

        </div>

      </div>

      <div class="footer">

        and still counting

        <span class="tiny-heart">♡</span>

      </div>

    </div>

  </div>

  <script>

    const startDate = new Date(

      2024,

      4,

      18,

      0,

      0,

      0

    );

    function updateCounter() {

      const now = new Date();

      let years =

        now.getFullYear()

        -

        startDate.getFullYear();

      let months =

        now.getMonth()

        -

        startDate.getMonth();

      let days =

        now.getDate()

        -

        startDate.getDate();

      let hours =

        now.getHours()

        -

        startDate.getHours();

      let minutes =

        now.getMinutes()

        -

        startDate.getMinutes();

      let seconds =

        now.getSeconds()

        -

        startDate.getSeconds();

      if (seconds < 0) {

        seconds += 60;

        minutes--;

      }

      if (minutes < 0) {

        minutes += 60;

        hours--;

      }

      if (hours < 0) {

        hours += 24;

        days--;

      }

      if (days < 0) {

        const previousMonthDays =

          new Date(

            now.getFullYear(),

            now.getMonth(),

            0

          ).getDate();

        days += previousMonthDays;

        months--;

      }

      if (months < 0) {

        months += 12;

        years--;

      }

      document

        .getElementById("years")

        .textContent = years;
      document

        .getElementById("months")

        .textContent = months;

      document

        .getElementById("days")

        .textContent = days;

      document

        .getElementById("hours")

        .textContent =

        String(hours).padStart(2, "0");

      document

        .getElementById("minutes")

        .textContent =

        String(minutes).padStart(2, "0");

      document

        .getElementById("seconds")

        .textContent =

        String(seconds).padStart(2, "0");

    }

    updateCounter();

    setInterval(

      updateCounter,

      1000

    );

  </script>

</body>

</html>
